[package]
name = "complai"
version = "0.1.0"
edition = "2024"

[dependencies]
calamine = "0.36.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
eyre = "0.6.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_yml = "0.0.13"
sha2 = "0.11.0"
walkdir = "2.5.0"

[dev-dependencies]
insta = "1.48.0"
rust_xlsxwriter = "0.96.0"
serial_test = "4.0.1"
tempfile = "3.27.0"
