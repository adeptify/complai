# 等保 2.0 第三级基本要求 (GB/T 22239-2019) 结构表。
#
# 只含控制点 ID 与短名(事实性结构信息),不含标准要求正文。
# 正文需手工摘录填充到各控制项文件,以规避标准文本版权。
# 结构供 `complai compliance scaffold dengbao-2.0` 生成控制桩使用。

framework: dengbao-2.0
level: 3

# ---------------------------------------------------------------------------
# 技术要求
# ---------------------------------------------------------------------------

domains:
  - key: 技术
    categories:
      - prefix: "8.1.1"
        name: 安全物理环境
        points:
          - 物理位置的选择
          - 物理访问控制
          - 防盗窃和防破坏
          - 防雷击
          - 防火
          - 防水和防潮
          - 防静电
          - 温湿度控制
          - 电力供应
          - 电磁防护
      - prefix: "8.1.2"
        name: 安全通信网络
        points:
          - 网络架构
          - 通信传输
          - 可信验证
      - prefix: "8.1.3"
        name: 安全区域边界
        points:
          - 边界防护
          - 访问控制
          - 入侵防范
          - 恶意代码和垃圾邮件防范
          - 安全审计
          - 可信验证
      - prefix: "8.1.4"
        name: 安全计算环境
        points:
          - 身份鉴别
          - 访问控制
          - 安全审计
          - 入侵防范
          - 恶意代码防范
          - 可信验证
          - 数据完整性
          - 数据保密性
          - 数据备份恢复
          - 剩余信息保护
          - 个人信息保护
      - prefix: "8.1.5"
        name: 安全管理中心
        points:
          - 系统管理
          - 审计管理
          - 安全管理
          - 集中管控

  # ---------------------------------------------------------------------------
  # 管理要求
  # ---------------------------------------------------------------------------

  - key: 管理
    categories:
      - prefix: "8.1.6"
        name: 安全管理制度
        points:
          - 安全策略
          - 管理制度
          - 制定与发布
          - 评审与修订
      - prefix: "8.1.7"
        name: 安全管理机构
        points:
          - 岗位设置
          - 人员配备
          - 授权和审批
          - 沟通和合作
          - 审核和检查
      - prefix: "8.1.8"
        name: 安全管理人员
        points:
          - 人员录用
          - 人员离岗
          - 安全意识教育和培训
          - 外部人员访问管理
      - prefix: "8.1.9"
        name: 安全建设管理
        points:
          - 定级和备案
          - 安全方案设计
          - 产品采购和使用
          - 自行软件开发
          - 外包软件开发
          - 工程实施
          - 测试验收
          - 系统交付
          - 等级测评
          - 服务供应商选择
      - prefix: "8.1.10"
        name: 安全运维管理
        points:
          - 环境管理
          - 资产管理
          - 媒介管理
          - 设备维护管理
          - 漏洞和风险管理
          - 网络和系统安全管理
          - 恶意代码防范管理
          - 密码管理
          - 变更管理
          - 备份与恢复管理
          - 安全事件处置
          - 应急预案管理
          - 集中管控
